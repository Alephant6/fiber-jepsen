name: Measure the snapshot cache (temporary)

# To be removed before merging. Two Fiber commits with the same tests/deploy,
# tests/nodes and Cargo.lock (develop 45ffdac, then a374fd5 three commits
# later): the first builds everything and saves fnn, the snapshot and the
# compiled dependencies; the second, a new commit that changes only Fiber's
# code, should build fnn on cached dependencies and restore the snapshot.
on:
  pull_request:
    paths:
      - '.github/workflows/measure-snapshot-cache.yml'

permissions:
  contents: read

jobs:
  first:
    uses: ./.github/workflows/jepsen.yml
    with:
      fiber-repository: nervosnetwork/fiber
      fiber-ref: 45ffdac8bd2d56f6e9cd4a01c2b2e4975c3e4397
      args: --time-limit 45 --faults none --ledger
      label: first-45ffdac
  second:
    needs: first
    if: always()
    uses: ./.github/workflows/jepsen.yml
    with:
      fiber-repository: nervosnetwork/fiber
      fiber-ref: a374fd53ebb6d6dd077029e61d1b2b5de6f5e1a9
      args: --time-limit 45 --faults none --ledger
      label: second-a374fd5
