name: Jepsen

# Runs Jepsen against one Fiber commit on a GitHub runner: checks out Fiber and
# this harness, builds fnn (once per Fiber commit, then cached) and the devnet
# snapshot (once per version of Fiber's test files, then cached), runs the test
# `runs` times, each with its own seed, and writes a table of the runs to the job summary. A run whose verdict isn't valid fails the job once all runs are done.
#
# smoke.yml calls it, it can be run by hand, and another repository's workflow
# (Fiber's CI, say) can call it pinned to a commit of this repository:
#
#   jobs:
#     jepsen:
#       uses: Alephant6/fiber-jepsen/.github/workflows/jepsen.yml@<commit>
#       with:
#         args: --time-limit 60 --faults kill --ledger
#
# A called workflow sees the caller's github context, so such a call tests the
# caller's commit by default. The harness is checked out at the commit this file
# was called at (job.workflow_sha), whoever the caller is.
on:
  workflow_call:
    inputs:
      fiber-repository:
        description: The Fiber repository. Empty means the calling repository.
        type: string
        default: ''
      fiber-ref:
        description: The Fiber commit, branch or tag. Empty means the calling run's commit.
        type: string
        default: ''
      args:
        description: Arguments for scripts/run.sh, the same for every run.
        type: string
        default: --time-limit 45 --faults none --ledger
      runs:
        description: How many times to run the test.
        type: number
        default: 1
      ckb-version:
        type: string
        default: 0.202.0
      label:
        description: Names the summary and the artifact; give each call in one workflow its own.
        type: string
        default: jepsen
      upload-store:
        description: Upload the store also when every run passes.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      fiber-repository:
        description: The Fiber repository
        default: nervosnetwork/fiber
      fiber-ref:
        description: The Fiber commit, branch or tag
        default: develop
      args:
        description: Arguments for scripts/run.sh (add --seed N to run a run's payments and faults again)
        default: --time-limit 60 --faults kill --kill-targets all --rate 20 --nemesis-interval 8 --quiesce 60 --ledger
      runs:
        description: How many times to run the test
        default: '1'
      ckb-version:
        description: The ckb release for the devnet
        default: 0.202.0
      label:
        description: Names the summary and the artifact
        default: jepsen
      upload-store:
        description: Upload the store also when every run passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  jepsen:
    name: ${{ inputs.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      FIBER_REPOSITORY: ${{ inputs.fiber-repository || github.repository }}
      FIBER_REF: ${{ inputs.fiber-ref || github.sha }}
      ARGS: ${{ inputs.args }}
      RUNS: ${{ inputs.runs }}
      CKB_VERSION: ${{ inputs.ckb-version }}
      LABEL: ${{ inputs.label }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository || 'Alephant6/fiber-jepsen' }}
          ref: ${{ job.workflow_sha }}
      - name: Check out Fiber
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FIBER_REPOSITORY }}
          ref: ${{ env.FIBER_REF }}
          path: fiber

      # Two caches, both saved before the runs, whatever their outcome:
      # - fnn, per Fiber commit and the system it is built on;
      # - the devnet snapshot (ckb, the chain, the node directories, the ssh
      #   key), which doesn't use fnn: Fiber's scripts build it from
      #   tests/deploy and tests/nodes only. It is keyed on every file there,
      #   the ckb version and the snapshot scripts, so a commit that changes
      #   only Fiber's code reuses it. SNAPSHOT_VERSION forces a rebuild.
      - id: key
        env:
          SNAPSHOT_VERSION: 1
        run: |
          sha="$(git -C fiber rev-parse HEAD)"
          echo "fiber-sha=$sha" >>"$GITHUB_OUTPUT"
          echo "harness-sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "fnn=jepsen-fnn-${sha}-ubuntu-24.04" >>"$GITHUB_OUTPUT"
          echo "snapshot=jepsen-snapshot-v${SNAPSHOT_VERSION}-ckb${CKB_VERSION}-${{ hashFiles('fiber/tests/deploy/**', 'fiber/tests/nodes/**') }}-${{ hashFiles('scripts/make-snapshot.sh', 'scripts/patch_node_config.py') }}" >>"$GITHUB_OUTPUT"
      - id: fnn
        uses: actions/cache/restore@v5
        with:
          path: fnn-bin
          key: ${{ steps.key.outputs.fnn }}
      - id: snapshot
        uses: actions/cache/restore@v5
        with:
          path: docker/build
          key: ${{ steps.key.outputs.snapshot }}

      - name: Install ckb, ckb-cli and the snapshot script's tools
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: |
          pkg="ckb_v${CKB_VERSION}_x86_64-unknown-linux-gnu-portable"
          curl -sSfL --retry 3 -o ckb.tar.gz \
            "https://github.com/nervosnetwork/ckb/releases/download/v${CKB_VERSION}/${pkg}.tar.gz"
          tar -xzf ckb.tar.gz
          mkdir -p ~/.local/bin
          install "${pkg}/ckb" "${pkg}/ckb-cli" ~/.local/bin/
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          sudo apt-get update -q
          sudo apt-get install -y -q python3-yaml netcat-openbsd
      # fnn is built on the runner, as Fiber's CI builds it; the node image is
      # the runner's Ubuntu release, so the binary runs there. rustup installs
      # the toolchain Fiber's rust-toolchain.toml names, which the deploy
      # script's udt-init build in the snapshot step uses too.
      - name: Install the Rust toolchain
        if: steps.fnn.outputs.cache-hit != 'true' || steps.snapshot.outputs.cache-hit != 'true'
        working-directory: fiber
        run: rustup toolchain install || rustup show
      # The compiled dependencies of fnn and of udt-init, kept across Fiber
      # commits (Fiber's CI caches its builds with the same action). A new
      # commit then compiles Fiber's own crates and any dependency whose
      # version changed, not all of them. Saved after the job, also when a run
      # fails, since the build itself succeeded. Only when fnn is built, so a
      # job that builds just the snapshot never saves a cache without fnn's
      # dependencies.
      - name: Restore the compiled dependencies
        id: deps
        if: steps.fnn.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fiber -> target
            fiber/tests/deploy/udt-init -> target
          shared-key: fnn-release
          # The toolchain is Fiber's, which the action's own key doesn't see.
          key: ${{ hashFiles('fiber/rust-toolchain.toml') }}
          cache-on-failure: true
      - name: Build fnn
        if: steps.fnn.outputs.cache-hit != 'true'
        working-directory: fiber
        run: |
          cargo build --release --locked -p fiber-bin
          install -D target/release/fnn ../fnn-bin/fnn
      - if: steps.fnn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: fnn-bin
          key: ${{ steps.key.outputs.fnn }}
      - name: Create the devnet snapshot
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: FNN_BIN= FIBER_SNAP="$PWD/fiber" scripts/make-snapshot.sh
      - if: steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: docker/build
          key: ${{ steps.key.outputs.snapshot }}
      - name: Put fnn into the snapshot
        run: install -D fnn-bin/fnn docker/build/bin/fnn

      # Every run starts from the snapshot; runs.txt gets one line per run: its
      # number, run.sh's exit status and its store directory. Each run gets its
      # own seed, unless the arguments give one to replay a run; seeds.txt gets
      # the run's number and its seed.
      #
      # load-N.log samples the runner every 30 s while run N goes: the load
      # average (/proc/loadavg) and each container's CPU and memory (docker
      # stats), to show how busy the runner was (six fnn nodes and many faults
      # at once, C-16, on 4 vCPUs). It goes into the run's store directory as
      # runner-load.log.
      - name: Run
        run: |
          set +e -u -o pipefail
          status=0
          given="$(grep -oE -- '--seed[= ]+[0-9]+' <<<"$ARGS" | grep -oE '[0-9]+$' || true)"
          for i in $(seq 1 "$RUNS"); do
            seed="${given:-$(od -An -N6 -tu8 /dev/urandom | tr -d ' ')}"
            extra=()
            [ -n "$given" ] || extra=(--seed "$seed")
            echo "::group::run $i of $RUNS, seed $seed"
            (while :; do
               echo "== $(date -u +%FT%TZ) loadavg $(cat /proc/loadavg) cpus $(nproc)"
               timeout 20 docker stats --no-stream --format '{{.Name}} cpu {{.CPUPerc}} mem {{.MemUsage}}' </dev/null
               sleep 30
             done) >"load-$i.log" 2>&1 &
            sampler=$!
            # ARGS is a list of arguments, so it is split on purpose.
            # shellcheck disable=SC2086
            scripts/run.sh $ARGS "${extra[@]}" 2>&1 | tee "run-$i.log"
            code=${PIPESTATUS[0]}
            kill "$sampler" 2>/dev/null
            # The chain container's log (ckb and its miner); the store has fnn's.
            (cd docker && docker compose logs --no-color --timestamps chain) >"chain-$i.log" 2>&1 </dev/null || true
            echo "::endgroup::"
            # store/latest names the run's directory; the control container sees
            # this checkout at /jepsen.
            dir="$(readlink store/latest 2>/dev/null)"
            dir="${dir#/jepsen/store/}"
            [ -z "$dir" ] || sudo cp "load-$i.log" "store/$dir/runner-load.log"
            echo "$i $code ${dir:-none}" >>runs.txt
            echo "$i $seed" >>seeds.txt
            [ "$code" -eq 0 ] || status=1
          done
          exit "$status"

      # Which checks failed in each run (jepsen.fiber.verdict reads its
      # results.edn), for the summary and for matrix.yml's report. The control
      # container sees the store at /jepsen/store.
      - name: Failed checks
        if: always()
        run: |
          [ -f runs.txt ] || exit 0
          dirs=()
          while read -r i code store; do
            [ "$store" = none ] || dirs+=("/jepsen/store/$store")
          done <runs.txt
          [ "${#dirs[@]}" -gt 0 ] || exit 0
          (cd docker && docker compose exec -T control lein run -m jepsen.fiber.verdict "${dirs[@]}") \
            >verdicts.txt </dev/null || true
          cat verdicts.txt

      - name: Summary
        if: always()
        env:
          FIBER_SHA: ${{ steps.key.outputs.fiber-sha }}
          HARNESS_SHA: ${{ steps.key.outputs.harness-sha }}
          HARNESS_REPOSITORY: ${{ job.workflow_repository }}
          FNN_HIT: ${{ steps.fnn.outputs.cache-hit == 'true' }}
          SNAPSHOT_HIT: ${{ steps.snapshot.outputs.cache-hit == 'true' }}
          DEPS_HIT: ${{ steps.deps.outputs.cache-hit }}
        run: |
          fnn="$(sha256sum docker/build/bin/fnn 2>/dev/null | cut -c1-16)"
          {
            echo "### ${LABEL}: \`${ARGS}\`"
            echo "- Fiber \`${FIBER_REPOSITORY}@${FIBER_SHA:0:10}\`, ckb ${CKB_VERSION}, fnn sha256 \`${fnn:-none}\` (first 16 hex digits)"
            echo "- Harness \`${HARNESS_REPOSITORY}@${HARNESS_SHA:0:10}\`"
            echo "- Restored from cache: fnn ${FNN_HIT}${DEPS_HIT:+ (compiled dependencies: exact match ${DEPS_HIT})}, devnet snapshot ${SNAPSHOT_HIT}"
            echo "- To run a run's payments and faults again, add \`--seed <its seed>\` to the arguments, with the same Fiber commit. Timing still differs, so a failure may take several runs to come back."
            echo
            echo "| Run | Seed | Exit | Verdict | Failed checks | Ledger | Post-heal probe | Success rate | Channels | Store |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            [ -f runs.txt ] || : >runs.txt
            # One tab-separated line per run, for matrix.yml's report.
            : >runs.tsv
            while read -r i code store; do
              log="run-$i.log"
              seed="$(awk -v i="$i" '$1 == i { print $2 }' seeds.txt 2>/dev/null || true)"
              verdict="$(grep -oE 'Everything looks good|Analysis invalid|Errors occurred during analysis|Jepsen broke' "$log" | tail -1 || true)"
              ledger="$(tr '\n' ' ' <"$log" | grep -oE ':outcome +:[a-z-]+' | tail -1 | grep -oE '[a-z-]+$' || true)"
              if [ -z "$verdict" ]; then probe="-"
              elif grep -q ':probe-failures \[\]' "$log"; then probe="ok"
              else probe="failed"; fi
              # pprint may put the map on the line after its key.
              channels="$(tr '\n' ' ' <"$log" | grep -oE ':channel-summary +\{[^}]*\}' | tail -1 | sed -E 's/:channel-summary +//' | tr -s ' ' || true)"
              # With --availability-window: the baseline's success rate, then the recovery's.
              rates="$(tr '\n' ' ' <"$log" | grep -oE ':success-rates +"[^"]*"' | tail -1 | sed -E 's/^:success-rates +"//; s/"$//; s/->/→/' || true)"
              failed="$(awk -F'\t' -v d="/jepsen/store/$store" '$1 == d { print $2 }' verdicts.txt 2>/dev/null || true)"
              echo "| $i | \`${seed:--}\` | $code | ${verdict:-none} | ${failed:--} | ${ledger:--} | $probe | ${rates:--} | ${channels:--} | \`${store}\` |"
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$LABEL" "$i" "${seed:--}" "$code" "${verdict:-none}" \
                "${failed:--}" "$probe" "${rates:--}" "${channels:--}" "$store" >>runs.tsv
            done <runs.txt
            # The runner's 1-minute load average while each run went (load-N.log).
            echo
            for f in load-*.log; do
              [ -f "$f" ] || continue
              awk -v run="${f//[^0-9]/}" '/^== / { n++; s += $4; if ($4 > m) m = $4; c = $NF }
                END { if (n) printf "- Run %s: runner load average (1 min) peak %.1f, mean %.1f, over %d samples, %s CPUs\n", run, m, s / n, n, c }' "$f"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      # Jepsen reports only that a node's RPC never came up; fnn's log says why,
      # and the chain's when the CKB node is the one that didn't come up.
      - name: Show the end of each node's fnn log in failed runs
        if: failure()
        run: |
          [ -f runs.txt ] || exit 0
          while read -r i code store; do
            [ "$code" -ne 0 ] || continue
            for f in store/"$store"/n*/fnn.log "chain-$i.log"; do
              [ -f "$f" ] || continue
              echo "== run $i: $f"
              tail -n 40 "$f"
            done
          done <runs.txt
      # The runs' lines, which matrix.yml's report job collects. The label goes in
      # the file's name too, since the report downloads every job's into one place.
      - name: Keep the runs' lines
        if: always()
        run: '[ -f runs.tsv ] && cp runs.tsv "$LABEL.runs.tsv" || true'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.label }}-runs
          path: ${{ inputs.label }}.runs.tsv
          if-no-files-found: ignore
          retention-days: 14
      # upload-artifact rejects ':' in file names, and Jepsen names each run's
      # directory by its start time, so the store goes up as one tarball: after a
      # failure, or always with upload-store.
      - name: Pack the store
        if: failure() || inputs.upload-store
        run: tar -czf "$LABEL-store.tgz" --ignore-failed-read store run-*.log chain-*.log load-*.log runs.txt seeds.txt
      - if: failure() || inputs.upload-store
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.label }}-store
          path: ${{ inputs.label }}-store.tgz
          retention-days: 14
