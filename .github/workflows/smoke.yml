name: Smoke

# One short run without faults against a pinned Fiber build: the cluster comes
# up, payments flow, and every checker passes, --ledger included. It tests this
# harness, not Fiber; fault runs against Fiber's develop don't gate merges. The
# steps are those of jepsen.yml, which other repositories can call, so this also
# keeps that workflow tested.
#
# Runs on main too, so that main holds the build cache pull requests restore
# (a cache saved by a pull request's run serves only that pull request).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker/**'
      - 'scripts/**'
      - 'project.clj'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/jepsen.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'docker/**'
      - 'scripts/**'
      - 'project.clj'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/jepsen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: run without faults
    uses: ./.github/workflows/jepsen.yml
    with:
      fiber-repository: nervosnetwork/fiber
      # The Fiber build under test: develop at the commit of FINDINGS.md's first
      # finding. Move it in a commit of its own.
      fiber-ref: ae6f7d3440c23025385537c1519d2af607f3b6a0
      args: --time-limit 45 --faults none --ledger
      label: smoke
