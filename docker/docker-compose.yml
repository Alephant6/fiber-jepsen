# A CKB devnet, six fnn nodes and a Jepsen control node on one private network.
# Build the artefacts first with scripts/make-snapshot.sh, then use scripts/run.sh.
# A test uses n1-n3 unless --nodes names more; nN is at 10.77.0.(10 + N)
# (jepsen.fiber.topology/node-ip), and its node directory comes from the snapshot.
name: fiber-jepsen

x-fnn-node: &fnn-node
  build:
    context: .
    dockerfile: node/Dockerfile
    args:
      NODE_BASE: ${NODE_BASE:-ubuntu:24.04}
  image: fiber-jepsen-node
  # iptables for partitions
  cap_add: [NET_ADMIN]

services:
  chain:
    build:
      context: .
      dockerfile: chain/Dockerfile
    image: fiber-jepsen-chain
    hostname: chain
    volumes:
      # The CKB node's clock offset, which the outage fault writes from control.
      - chain-clock:/chain-clock
    networks:
      fibernet: {ipv4_address: 10.77.0.10}

  n1:
    <<: *fnn-node
    hostname: n1
    networks:
      fibernet: {ipv4_address: 10.77.0.11}

  n2:
    <<: *fnn-node
    hostname: n2
    networks:
      fibernet: {ipv4_address: 10.77.0.12}

  n3:
    <<: *fnn-node
    hostname: n3
    networks:
      fibernet: {ipv4_address: 10.77.0.13}

  # For multi-node topologies (--nodes n1,...,n6 --topology ring or mesh).
  n4:
    <<: *fnn-node
    hostname: n4
    networks:
      fibernet: {ipv4_address: 10.77.0.14}

  n5:
    <<: *fnn-node
    hostname: n5
    networks:
      fibernet: {ipv4_address: 10.77.0.15}

  n6:
    <<: *fnn-node
    hostname: n6
    networks:
      fibernet: {ipv4_address: 10.77.0.16}

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    image: fiber-jepsen-control
    hostname: control
    volumes:
      - ..:/jepsen
      - m2:/root/.m2
      - chain-clock:/chain-clock
      # Docker's API, for the cpu and memory faults (docker update on the node
      # containers). It gives the control container control of the host's Docker
      # daemon: fine on a CI runner, a trade-off on a workstation.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      fibernet: {ipv4_address: 10.77.0.5}

volumes:
  m2: {}
  chain-clock: {}

networks:
  fibernet:
    ipam:
      config:
        - subnet: 10.77.0.0/24
